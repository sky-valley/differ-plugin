<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The shared wall</title>
<style>body{margin:0;background:#f2d88c;color:#29251c;font:18px system-ui}main{max-width:36rem;margin:auto;padding:1.5rem}h1{font-size:3rem;line-height:1}textarea{box-sizing:border-box;display:block;width:100%;font:inherit}button{font:inherit;margin:.4rem;padding:.6rem}ul{list-style:none;padding:0;display:grid;gap:1rem}li{background:#fff5cf;padding:1rem;overflow-wrap:anywhere}#status{min-height:2em}</style>
<main><h1>The shared wall</h1><p>Leave a thought. Anyone who joins can rewrite or remove any note. This wall belongs to the room.</p>
<form><label>A thought <textarea id="thought" required maxlength="1000"></textarea></label><button>Add a note</button></form><p id="status" role="status"></p><ul id="wall" aria-label="Shared notes"></ul></main>
<script src="/-/client.js"></script><script type="module" src="./app.mjs"></script></html>
