name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require an exact version tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== `v${p.version}`) process.exit(1)'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code
      - run: npm run release
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --generate-notes --title "Differ $RELEASE_TAG"
